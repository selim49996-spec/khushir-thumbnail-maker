<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241044">
<title>Khushir Thumbnail Maker</title>
<style>
:root{font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#211633;background:#f4f1fa}
*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#241044,#7138d8);color:#fff;padding:18px 16px}
.wrap{max-width:1280px;margin:auto}.brand{display:flex;align-items:center;gap:14px}.brand img{width:86px;height:86px;object-fit:cover;border:3px solid #ffd85a;border-radius:18px;background:#fff}.top h1{font-size:23px;margin:0 0 4px}.top p{margin:0;opacity:.9;font-size:13px}
main{padding:14px;display:grid;grid-template-columns:minmax(270px,390px) 1fr;gap:15px}
.panel{background:#fff;border-radius:15px;padding:15px;box-shadow:0 5px 20px #29144a12;min-width:0}
h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:11px 0 5px}
input,select,button{font:inherit}input[type=text],select{width:100%;padding:10px;border:1px solid #d9d0e7;border-radius:9px;background:#fff;color:#211633}
input[type=file]{width:100%;font-size:13px}input[type=color]{width:100%;height:37px;border:1px solid #ddd;border-radius:8px;background:#fff;padding:3px}
input[type=range]{width:100%;accent-color:#7138d8}
button{border:0;border-radius:9px;padding:11px 13px;background:#7138d8;color:white;font-weight:750;cursor:pointer}
button.secondary{background:#eee7f8;color:#42206d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.preview{display:flex;justify-content:center;align-items:center;background:#eee9f5;border-radius:11px;padding:12px;min-height:250px;overflow:hidden}
canvas{display:block;max-width:100%;height:auto;max-height:76vh;border-radius:6px;box-shadow:0 4px 16px #0002}
.hint{font-size:11px;color:#746b80;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.check{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:10px}.check input{accent-color:#7138d8}
.adjust{background:#f8f5fc;border:1px solid #e8e0f1;border-radius:11px;padding:10px;margin-top:12px}
.adjust label{margin-top:8px}.adjust label:first-child{margin-top:0}
.status{font-size:12px;background:#f8f5fc;border-radius:9px;padding:9px;white-space:pre-line;margin-top:8px}
button:disabled,input:disabled{opacity:.48;cursor:not-allowed}
#notificationBtn[aria-pressed="true"]{background:#15803d}
#permissionToggle[aria-pressed="false"]{background:#9f1239;color:#fff}
#desktopBtn[aria-pressed="true"]{background:#15803d;color:#fff}

@media(max-width:760px){main{grid-template-columns:1fr}.preview{order:-1;min-height:180px}canvas{max-height:48vh}.top h1{font-size:20px}.brand img{width:68px;height:68px}}
body.desktop-mode main{grid-template-columns:390px minmax(0,1fr);max-width:1500px}
body.desktop-mode .preview{min-height:500px}
body.desktop-mode canvas{max-height:85vh}
@media(max-width:760px){body.desktop-mode main{grid-template-columns:1fr}}
</style>
</head>
