<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241044">
<title>Khushir Thumbnail Maker</title>
<style>
:root{font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#211633;background:#f5f1fb}
*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#241044,#7138d8);color:white;padding:22px 16px}
.wrap{max-width:920px;margin:auto}.top h1{font-size:24px;margin:0 0 5px}.top p{margin:0;opacity:.9}
main{padding:16px;display:grid;grid-template-columns:1fr;gap:16px}
.panel{background:white;border-radius:16px;padding:16px;box-shadow:0 5px 20px #29144a12}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:14px;font-weight:650;margin:12px 0 6px}
input,select,button{font:inherit}input[type=text],select{width:100%;padding:12px;border:1px solid #d9d0e7;border-radius:10px;background:white}
input[type=file]{width:100%;font-size:14px}button{border:0;border-radius:10px;padding:12px 16px;background:#7138d8;color:white;font-weight:700;cursor:pointer}
button.secondary{background:#eee7f8;color:#42206d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.preview{display:flex;justify-content:center;align-items:center;background:#eee9f5;border-radius:12px;padding:12px;min-height:220px}
canvas{max-width:100%;height:auto;border-radius:6px;box-shadow:0 4px 16px #0002}
.hint{font-size:12px;color:#746b80;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){main{grid-template-columns:340px 1fr;padding-top:22px}.preview{min-height:360px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>খুশির থাম্বনেল মেকার</h1><p>নিজের ছবি ও লোগো দিয়ে YouTube থাম্বনেল তৈরি করুন</p></div></header>
<main class="wrap">
<section class="panel">
<h2>থাম্বনেল সাজান</h2>
<label for="photo">নিজের ছবি যোগ করুন</label><input id="photo" type="file" accept="image/*">
<label for="logo">চ্যানেলের লোগো যোগ করুন (ঐচ্ছিক)</label><input id="logo" type="file" accept="image/*">
<label for="headline">ভিডিওর শিরোনাম</label><input id="headline" type="text" maxlength="70" value="আজকের মজার গল্প">
<label for="channel">চ্যানেলের নাম</label><input id="channel" type="text" maxlength="40" value="Khushir Cartoon Ghor">
<div class="row">
<div><label for="lang">ভাষা</label><select id="lang"><option>বাংলা</option><option>हिन्दी</option><option>English</option><option>ગુજરાતી</option><option>मराठी</option><option>தமிழ்</option></select></div>
<div><label for="size">সাইজ</label><select id="size"><option value="wide">16:9 YouTube</option><option value="short">9:16 Shorts</option></select></div>
</div>
<div class="actions"><button id="download">থাম্বনেল ডাউনলোড</button><button class="secondary" id="reset">রিসেট</button></div>
<p class="hint">ছবি আপনার ডিভাইসেই প্রসেস হয়। ডাউনলোড করা ফাইল PNG ফরম্যাটে থাকবে।</p>
</section>
<section class="panel">
<h2>প্রিভিউ</h2><div class="preview"><canvas id="canvas" width="1280" height="720"></canvas></div>
<p class="hint">ছবি না দিলেও শিরোনাম ও চ্যানেলের নাম দিয়ে থাম্বনেল তৈরি করা যাবে।</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id), c=$('canvas'),ctx=c.getContext('2d');
let photo=null,logo=null;
function load(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cb(im);im.src=r.result};r.readAsDataURL(file)}
$('photo').onchange=e=>load(e.target.files[0],im=>{photo=im;draw()});
$('logo').onchange=e=>load(e.target.files[0],im=>{logo=im;draw()});
['headline','channel','size','lang'].forEach(id=>$(id).addEventListener('input',draw));
function cover(im,x,y,w,h){let s=Math.max(w/im.width,h/im.height),sw=w/s,sh=h/s,sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
function draw(){
 const short=$('size').value==='short';c.width=short?720:1280;c.height=short?1280:720;
 const w=c.width,h=c.height;
 const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#251044');g.addColorStop(.55,'#7138d8');g.addColorStop(1,'#ef8d45');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 if(photo){ctx.save();ctx.globalAlpha=.78;cover(photo,0,0,w,h);ctx.restore();ctx.fillStyle='rgba(20,8,35,.48)';ctx.fillRect(0,0,w,h)}
 const pad=w*.055;
 ctx.fillStyle='#ffd84d';ctx.font=`900 ${short?54:68}px system-ui, sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';
 ctx.shadowColor='#160b22';ctx.shadowBlur=12;ctx.shadowOffsetY=5;
 const title=$('headline').value.trim()||'আপনার ভিডিওর শিরোনাম';
 const maxW=w-pad*2;let words=title.split(/\s+/),lines=[],line='';
 for(const word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);
 let fs=short?54:68; if(lines.length>3)fs*=.78;ctx.font=`900 ${fs}px system-ui, sans-serif`;
 lines.slice(0,4).forEach((t,i)=>ctx.fillText(t,pad,h*(short?.59:.62)+i*fs*1.13,maxW));
 ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.fillStyle='rgba(20,8,35,.78)';let bandH=short?100:88;ctx.fillRect(0,h-bandH,w,bandH);
 ctx.fillStyle='white';ctx.font=`700 ${short?30:34}px system-ui, sans-serif`;ctx.textBaseline='middle';ctx.fillText($('channel').value||'Khushir Cartoon Ghor',pad,h-bandH/2,w-pad*2);
 if(logo){let s=Math.min((short?82:76)/logo.width,(short?82:76)/logo.height);let lw=logo.width*s,lh=logo.height*s;ctx.drawImage(logo,w-pad-lw,h-bandH+(bandH-lh)/2,lw,lh)}
}
$('download').onclick=()=>{const a=document.createElement('a');a.download='khushir-thumbnail.png';a.href=c.toDataURL('image/png');a.click()};
$('reset').onclick=()=>{$('photo').value='';$('logo').value='';$('headline').value='আজকের মজার গল্প';$('channel').value='Khushir Cartoon Ghor';$('size').value='wide';photo=logo=null;draw()};
draw();
</script>
</body></html>
